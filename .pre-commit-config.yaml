repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trailing whitespace
        entry: bash -c 'while IFS= read -r -d "" f; do sed -i.bak -- "s/[[:space:]]*$//" "$f" && rm -f -- "$f.bak"; done < <(git diff --cached --name-only -z --diff-filter=ACM)'
        language: system
        pass_filenames: false

      - id: end-of-file-fixer
        name: end of file fixer
        entry: bash -c 'changed=0; while IFS= read -r -d "" f; do if [ -s "$f" ] && [ -n "$(tail -c1 -- "$f")" ]; then echo >> "$f"; changed=1; fi; done < <(git diff --cached --name-only -z --diff-filter=ACM); [ "$changed" -eq 0 ]'
        language: system
        pass_filenames: false

      - id: gofmt
        name: gofmt (check)
        entry: bash -c 'test -z "$(gofmt -s -l .)"'
        language: system
        pass_filenames: false
        types: [go]

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        types: [go]

      - id: go-test-short
        name: go test (short)
        entry: go test ./... -short -count=1
        language: system
        pass_filenames: false
        types: [go]
