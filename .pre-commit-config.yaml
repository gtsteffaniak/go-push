repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trailing whitespace
        entry: bash -c 'files=$(git diff --cached --name-only --diff-filter=ACM); [ -z "$files" ] || echo "$files" | xargs -r sed -i "s/[[:space:]]*$//"'
        language: system
        pass_filenames: false

      - id: end-of-file-fixer
        name: end of file fixer
        entry: bash -c 'files=$(git diff --cached --name-only --diff-filter=ACM); for f in $files; do [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ] && echo >> "$f"; done'
        language: system
        pass_filenames: false

      - id: gofmt
        name: gofmt (check)
        entry: bash -c 'test -z "$(gofmt -s -l .)"'
        language: system
        pass_filenames: false
        types: [go]

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        types: [go]

      - id: go-test-short
        name: go test (short)
        entry: go test ./... -short -count=1
        language: system
        pass_filenames: false
        types: [go]
